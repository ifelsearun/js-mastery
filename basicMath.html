<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        const myInt = 5;
        const myFloat = 6.667;

        console.log(myInt);
        console.log(myFloat);

        console.log(typeof myInt);
        console.log(typeof myFloat);
    </script>

    <script>
        const lotsOfDecimal = 1.798745324;
        console.log(lotsOfDecimal);
        const twoDecimalPlaces = lotsOfDecimal.toFixed(2);
        console.log(twoDecimalPlaces);
    </script>

    <script>
        let myNumber = "74";
        console.log(myNumber);
        myNumber += 3;
        console.log(myNumber);

        /*You end up with the result 743, not 77, because myNumber 
        is actually defined as a string*/

        console.log(typeof myNumber);
        myNumber = "74";
        myNumber = Number(myNumber) + 3;
        console.log(myNumber);

        //The result is then 77, as initially expected.

        let myText = 3456;
        console.log(typeof myText);
        myText = String(myText);
        console.log(typeof myText);
    </script>

    <script>
        //Arithmetic operators

        let a = 25, b = 5;
        console.log(a + b);
        console.log(a * b);
        console.log(a - b);
        console.log(a / b);
        console.log(a % b);
        console.log(a ** b);
    </script>

    <script>
        //increment and decrement 

        let num1 = 4;
        console.log(num1++);
        console.log(num1);
        console.log(num1--);
        console.log(num1);
        console.log(++num1);
        console.log(++num1);
        console.log(--num1);
        console.log(--num1);
    </script>

    <script>
        //Assignment operators
        console.log('Assignment operators');
        let x = 3;
        let y = 4;
        console.log(x);
        console.log(y);

        x += 2;
        console.log(x);
        y -= 3;
        console.log(y);
        x *= 2;
        console.log(x);
        y /= 4;
        console.log(y);
        x %= 3;
        console.log(x);
        y **= 8;
        console.log(y);
    </script>

    <script>
        // comparison operators

        let num2 = 5;

        console.log(num2 == 5);
        console.log(num2 == '5');
        console.log(num2 === 5);
        console.log(num2 === '5');
        console.log(num2 !== 5);
        console.log(num2 < 10);
        console.log(num2 > 10);
        console.log(num2 <= 2);
        console.log(num2 >= 10);
    </script>

    <button>Start machine</button>
    <p>The machine is stopped.</p>

    <script>
        const btn = document.querySelector("button");
        const txt = document.querySelector("p");

        btn.addEventListener("click", updateBtn);

        function updateBtn() {
            if (btn.textContent === "Start machine") {
                btn.textContent = "Stop machine";
                txt.textContent = "The machine has started!";
            } else {
                btn.textContent = "Start machine";
                txt.textContent = "The machine is stopped.";
            }
        }
    </script>

    <script>
        // Unary , binary, operands

        let A = 1;
        A = -A;
        console.log(A);

        let B = 1, C = 3;
        console.log(C - B);

        // exponentiation
        // Root
        console.log(4 ** (1 / 2));
        console.log(8 ** (1 / 3));
    </script>

    <script>
        //String concatenation with binary +

        let s = "my" + "string";
        console.log(s);

        // the binary + operators converts numbers into strings

        console.log('1' + 2);
        console.log(2 + '3');

        console.log(2 + 2 + '1');
        console.log(1 + 1 + '2');

        // other operators like -,/ are only work with numbers
        // it converts strings into number

        console.log('6' - 2);//4
        console.log('6' / '2');//3
        console.log('12' % 6);//0
    </script>

    <script>
        //Numeric conversion, unary +
        // The unary + operator converts a non-numbers to numbers

        x = 1;
        console.log(+x);//1 no change
        y = -2;
        console.log(+y);//-2 no change

        console.log(+true);//1 convert boolean value to number
        console.log(+"");//0 convert void value to 0

        // problem:
        let apples = "2";
        let oranges = "3";

        console.log(apples + oranges); // "23", the binary plus concatenates strings

        //solution:
        apples = "2";
        oranges = "3";

        // both values converted to numbers before the binary plus
        console.log(+apples + +oranges); // 5

        // the longer variant
        // alert( Number(apples) + Number(oranges) ); // 5
    </script>

    <script>
        // Assignment operator =
        // assignment operator have the lowest precedence of 2

        x = 2 * 2 + 1;
        console.log(x); // 5

        a = 1;
        b = 2;

        let c = 3 - (a = b + 1);

        console.log(a); // 3
        console.log(c); // 0

        //chaining assignments

        a = b = c = 2 + 2;
        console.log(a);//4
        console.log(b);//4
        console.log(c);//4
    </script>
</body>

</html>
