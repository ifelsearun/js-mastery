<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strings in javaScript</title>
</head>

<body>

    <script>
        const string = "The revolution will not be televised.";
        console.log(string);

        const badString = string;
        console.log(badString);
    </script>

    <script>
        const single = 'Single quotes';
        const double = "Double quotes";
        const backtick = `Backtick`;

        console.log(single);
        console.log(double);
        console.log(backtick);
    </script>

    <script>
        // embedding javaScript

        const name = 'chris';
        const greatings = ` hello!, ${name} `;
        console.log(greatings);

        const one = 'Hello!, ';
        const two = 'How are you?';
        const joined = `${one}${two}`;
        console.log(joined);
    </script>

    <!-- concatenation-->
    <button>Click me</button>
    <div id="greeting"></div>

    <script>
        const button = document.querySelector("button");

        function greet() {
            const name = prompt("What is your name?");
            const greeting = document.querySelector("#greeting");
            greeting.textContent = `Hello ${name}, nice to see you!`;
        }

        button.addEventListener("click", greet);
    </script>

    <script>
        const greeting2 = "Hello!";
        const name2 = "Bob!.";
        console.log(greeting2 + ", " + name2);

        // using template literals
        const greeting3 = "Howdy!";
        const name3 = "Ramesh.";
        console.log(`${greeting3}, ${name3}`);
    </script>

    <script>
        // Including expressions in strings

        const song = "Range of Revenge";
        const score = 9;
        const highScore = 10;
        const output = ` I like the song ${song}. I gave it a score of ${(score / highScore) * 100}%. `;
        console.log(output);
    </script>

    <script>
        // Multiline strings
        //1. using template literals
        const newline = `One day you finally knew
        what you had to do, and began,`;
        console.log(newline);

        //2. using normal string
        const newline2 = "One day you finally knew\nwhat you had to do, and began,";// use line breaks (\n)
        console.log(newline2);
    </script>

    <script>
        // Including quotes in strings

        //1. method one:
        const goodQuotes1 = 'She said "I think so!"';
        const goodQuotes2 = `She said "I'm not going in there!"`;
        console.log(goodQuotes1);
        console.log(goodQuotes2);

        //2. mehtod 2: by putting a backslash just before the character
        const bigmouth = 'I\'ve got no right to take my place…';
        console.log(bigmouth);
    </script>

    <script>
        //Numbers vs. strings

        const coolBandName = "Front ";
        const number = 242;
        console.log(coolBandName + number);

        //Number()
        const myString = "123";
        const myNum = Number(myString);
        console.log(typeof myNum);

        //String()
        const myNum2 = 123;
        const myString2 = String(myNum2);
        console.log(typeof myString2);
    </script>


    <script>
        // String methods

        // 1.length
        let text = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let length = text.length;
        console.log(text);
        console.log(length);

        // exracting string characters
        // 2. charAt(): The charAt() method returns the character at a specified index (position) in a string
        console.log(text.charAt(11));
        console.log(text.charAt(14));
        console.log(text.charAt(21));
        console.log(text.charAt(4));

        // 3. charCodeAt(): The charCodeAt() method returns the code of the character at a specified index in a string
        // The method returns a UTF-16 code (an integer between 0 and 65535)
        console.log(text.charCodeAt(0));
        console.log(text.charCodeAt(1));
        console.log(text.charCodeAt(2));
        console.log(text.charCodeAt(25));

        // 4. at(): The at() method returns the character at a specified index (position) in a string
        // The at() method is supported in all modern browsers since March 2022
        console.log(text.at(7));
        console.log(text.at(0));
        console.log(text.at(15));
        console.log(text.at(15));
        console.log(text.at(24));
        console.log(" ");

        // 5. [] is also used to extract char at a specified index
        console.log(text[15]);
        console.log(text[24]);
        console.log(text[19]);
        console.log(text[7]);
        console.log(text[14]);
        console.log(text[13]);
    </script>
</body>

</html>
