    <script>
        //Numbers vs. strings

        const coolBandName = "Front ";
        const number = 242;
        console.log(coolBandName + number);

        //Number()
        const myString = "123";
        const myNum = Number(myString);
        console.log(typeof myNum);

        //String()
        const myNum2 = 123;
        const myString2 = String(myNum2);
        console.log(typeof myString2);
    </script>


    <script>
        // String methods

        // 1.length
        let text = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        let Length = text.length;
        console.log(text);
        console.log(Length);

        // exracting string characters
        // 2. charAt(): The charAt() method returns the character at a specified index (position) in a string
        console.log(text.charAt(11));
        console.log(text.charAt(14));
        console.log(text.charAt(21));
        console.log(text.charAt(4));

        // 3. charCodeAt(): The charCodeAt() method returns the code of the character at a specified index in a string
        // The method returns a UTF-16 code (an integer between 0 and 65535)
        console.log(text.charCodeAt(0));
        console.log(text.charCodeAt(1));
        console.log(text.charCodeAt(2));
        console.log(text.charCodeAt(25));

        // 4. at(): The at() method returns the character at a specified index (position) in a string
        // The at() method is supported in all modern browsers since March 2022
        console.log(text.at(7));
        console.log(text.at(0));
        console.log(text.at(15));
        console.log(text.at(15));
        console.log(text.at(24));
        console.log(" ");

        // 5. [] is also used to extract char at a specified index
        console.log(text[15]);
        console.log(text[24]);
        console.log(text[19]);
        console.log(text[7]);
        console.log(text[14]);
        console.log(text[13]);
        console.log("")

        // The at() method is a new addition to JavaScript.
        // It allows the use of negative indexes while charAt() do not.
        const name4 = "Alice";
        console.log(name4.at(-1));

        // this is the same as at(-1)
        console.log(name4.charAt(name4.length - 1));


        // JavaScript String concat()
        // 6. concat():  joins two or more strings

        let text1 = "hello";
        let text2 = "world";
        let textJoin = text1.concat(" ", text2);
        console.log(textJoin)

        let text3 = "How";
        let text4 = "are";
        let text5 = "you!";
        let textJoin2 = text3.concat(" ", text4, " ", text5);
        console.log(textJoin2);

        // The concat() method can be used instead of the plus operator. These two lines do the same:
        text1 = "Hello" + " " + "World!";
        text2 = "Hello".concat(" ", "world!");
        console.log(text1);
        console.log(text2);

        // Extracting String Parts:
        // There are 3 methods for extracting a part of a string:
        // 1. JavaScript String slice():
        // slice() extracts a part of a string and returns the extracted part in a new string.
        // The method takes 2 parameters: start position, and end position (end not included).

        let string1 = "Apple, Banana, Kiwi";
        let stringSlice = string1.slice(7, 13);
        console.log(stringSlice);// Banana
        console.log(string1.slice(0, 5));// Apple

        // if you want to avoid first part and slice the rest then use one paramter 
        console.log(string1.slice(7));// Banana, Kiwi

        // If a parameter is negative, the position is counted from the end of the string:
        console.log(string1.slice(-12));// Banana, Kiwi

        // This example slices out a portion of a string from position -12 to position -6:
        console.log(string1.slice(-12, -6));// Banana

        // 2. JavaScript String substring():
        // substring() is similar to slice().
        // The difference is that start and end values less than 0 are treated as 0 in substring().

        let string2 = "Apple, Banana, Kiwi";
        let stringSlice2 = string2.substring(7, 13);// Banana
        console.log(string2.substring(-12, 19));// Apple, Banana, Kiwi

        // 3. JavaScript String substr():
        // substr() is similar to slice().
        // difference is that the second parameter specifies the length of the extracted part.

        console.log(string2.substr(7, 6));// Banana
        console.log(string2.substr(7));// Banana, Kiwi
        console.log(string2.substr(-4));// Kiwi

        // Converting to Upper and Lower Case

        //1. JavaScript String toUpperCase():
        text1 = "Hello World!";
        text2 = text1.toUpperCase();
        console.log(text2);// HELLO WORLD!
        console.log(" ");

        text1 = "HELLO WORLD!";       // String
        text2 = text1.toLowerCase();  // text2 is text1 converted to lower
        console.log(text2);
        console.log(" ");


        //2. JavaScript String isWellFormed():
        // The isWellFormed() method returns true if a string is well formed.
        // Otherwise it returns false.
        // A string is not well formed if it contains lone surrogates.

        text1 = "Hello world!";
        let result = text1.isWellFormed();
        console.log(result);

        text2 = "Hello World \uD800";
        result = text2.isWellFormed();
        console.log(result);

        text3 = `Lorem ipsum dolor sit, amet consectetur adipisicing elit. 
        Repellat non laudantium quo repellendus nulla alias ullam delectus quaerat 
        totam beatae! Nesciunt obcaecati labore accusantium dicta at vel. Similique, 
        impedit officia!`;
        console.log(text3.isWellFormed());

        //3. JavaScript String toWellFormed():
        /* The String method toWellFormed() returns a new string where all 
        "lone surrogates" are replaced with the Unicode replacement character (U+FFFD).
        */

        text1 = "Hello World \uD800";
        result = text1.toWellFormed();
        console.log(result);// Hello World �
        console.log(" ");

        //3. JavaScript String trim():
        // The trim() method removes whitespace from both sides of a string:

        text1 = "     Hello World!      ";
        text2 = text1.trim();
        console.log(text1);
        console.log(text2);
        console.log(" ");

        //4. javaScript string trimStart()
        // the trimSart() method removes whitespace from only the start of a string
        console.log(text1.trimStart());// 'Hello World!    '

        //5. javascript trimEnd():
        // the trimEnd() method removes whitespace from only the end of a string
        console.log(text1.trimEnd());// '    Hello World!'


        //6. javaScript string padStart() method:
        // the padStart() method pads a string at the start of another string until it reaches a given length
        text = "5";
        console.log(text.padStart(5, "0"));

        //The padStart() method is a string method.
        //ad a number, convert the number to a string first.
        num = 5;
        text = num.toString();
        console.log(text.padStart(4, "+"));

        //7. javaScript string padEnd() method:
        // the pasEnd() method pads a string at the end of another string until it reaches a given length
        text = "luv";
        console.log(text.padEnd(7, "u"));


        //8. JavaScript String repeat()
        //The repeat() method returns a string with a number of copies of a string.
        // //The repeat() method returns a new string.
        // //The repeat() method does not change the original string.
        text = "Hello World!";
        result = text.repeat(2);
        console.log(result);
        console.log(result.repeat(2));

        //9. javaScript replace() method:
        // the replace() method replaces a specified value with another in string
        text = "please visit Microsoft!";
        new_text = text.replace("Microsoft", "Google");
        console.log(new_text);

        // The replace() method does not change the string it is called on.
        // The replace() method returns a new string.
        // The replace() method replaces only the first match

        // If you want to replace all matches, use a regular expression with the /g flag set. See examples below.
        // By default, the replace() method replaces only the first match:

        text = "please visit Google and Google";
        new_text = text.replace("Google", "Microsoft");
        console.log(new_text);

        //To replace all matches, use a regular expression with a /g flag (global match):
        text = "please visit Google and Google";
        new_text = text.replace(/Google/g, "Microsoft");
        console.log(new_text);

        text = "javaScript javaScript javaScript javaScript javaScript";
        console.log(text.replace(/javaScript/g, "PYTHON"));

        //To replace case insensitive, use a regular expression with an /i flag (insensitive):
        text = "PYTHON";
        new_text = text.replace(/Python/i, "JavaScript");
        console.log(new_text);

        text = "PYTHON PYTHON PYTHON PYTHON PYTHON";
        new_text = text.replace(/Python/ig, "JavaScript");
        console.log(new_text);


        //10. javaScript replaceAll() method:
        // the replaceAll() method used to replace all the no. of sepcified values with a string

        text = "I love cats. Cats are easy to love, Cats are very popular";
        text = text.replaceAll("cats", "dogs");
        text = text.replaceAll("Cats", "Dogs");
        console.log(text);

        // The replaceAll() method allows you to specify a regular expression instead of a string to be replaced.
        // If the parameter is a regular expression, the global flag (g) must be set, otherwise a TypeError is thrown.
        text = "I love cats. Cats are easy to love, Cats are very popular";
        text = text.replaceAll(/cats/g, "dogs");
        text = text.replaceAll(/Cats/g, "Dogs");
        console.log(text);

        text = "javaScript, javaScript, JAVASCRIPT, javaScript, JAVASCRIPT";
        text = text.replaceAll(/javaScript/gi, "Python");
        console.log(text);


        //11. JavaScript String split():
        // A string can be converted to an array with the split() method:
        text = "Hello World!";
        const myArr = text.split("");
        console.log(myArr);
        console.log(" ");
        //text.split("")     // Split on characters
        //text.split(",")    // Split on commas
        //text.split(" ");    // Split on spaces
        //text.split("|")    // Split on pipe

        let shoppingDone = true;
        let childAllowance;

        if (shoppingDone === true) {
            childAllowance = 10;
        } else {
            childAllowance = 5;
        }

        console.log(childAllowance);
    </script>

    <label for="weather">Select the weather type today: </label>
    <select id="weather">
        <option value="">--Make a choice--</option>
        <option value="sunny">Sunny</option>
        <option value="rainy">Rainy</option>
        <option value="snowing">Snowing</option>
        <option value="overcast">Overcast</option>
    </select>

    <p></p>

    <script>
        const select = document.querySelector("select");
        const para = document.querySelector("p");

        select.addEventListener("change", setWeather);

        function setWeather() {
            const choice = select.value;

            if (choice === "sunny") {
                para.textContent =
                    "It is nice and sunny outside today. Wear shorts! Go to the beach, or the park, and get an ice cream.";
            } else if (choice === "rainy") {
                para.textContent =
                    "Rain is falling outside; take a rain coat and an umbrella, and don't stay out for too long.";
            } else if (choice === "snowing") {
                para.textContent =
                    "The snow is coming down — it is freezing! Best to stay in with a cup of hot chocolate, or go build a snowman.";
            } else if (choice === "overcast") {
                para.textContent =
                    "It isn't raining, but the sky is grey and gloomy; it could turn any minute, so take a rain coat just in case.";
            } else {
                para.textContent = "";
            }
        }
    </script>
