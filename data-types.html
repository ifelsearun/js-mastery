<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-types in JavaScript</title>
</head>

<body>

    <script>
        //Javascript is dynamically typed
        let message = 'hello world';
        console.log(message);
        message = 245643;
        console.log(message);

        //Infinity, -Infinity, NaN values
        console.log(1 / 0);//Infinity
        console.log(-1 / 0);//-Infinity
        console.log(Infinity);

        //NaN
        console.log("Not a Number" / 2);//NaN

        //NaN is sticky 
        console.log(NaN + 1); // NaN
        console.log(3 * NaN); // NaN
        console.log("not a number" / 2 - 1); // NaN

        //One exception
        console.log(NaN ** 0);// 1
    </script>

    <script>
        //BigInt
        console.log(9007199254740991 + 1); // 9007199254740992
        console.log(9007199254740991 + 2); // 9007199254740992

        //use n at last of a big integer
        let number = 123456789012345678901234567890n;
        console.log(number);
    </script>

    <script>
        //strings
        let str = "Hello";
        let str2 = 'single quotes are okey too';
        let phrase = `can embed another ${str}`;
        console.log(str);
        console.log(str2);
        console.log(phrase);

        let string = ` hello world `;
        console.log(string);

        let name = "John";

        // embed a variable
        console.log(`Hello, ${name}!`); // Hello, John!

        // embed an expression
        console.log(`the result is ${1 + 2}`); // the result is 3

        console.log("the result is ${1 + 2}"); // the result is ${1 + 2} (double quotes do nothing)
    </script>

    <script>
        //Boolean
        let isGreater = 4 > 1;

        console.log(isGreater); // true (the comparison result is "yes")
    </script>

    <script>
        //Null value
        let age = null;
        console.log(age);
        console.log(typeof age);
    </script>

    <script>
        //undefined
        let num;

        console.log(num); // shows "undefined"

        num = 100;

        // change the value to undefined
        num = undefined;

        console.log(num); // "undefined"
    </script>

    <script>
        // the typeof operator
        console.log(typeof undefined); // "undefined"

        console.log(typeof 0); // "number"

        console.log(typeof 10n); // "bigint"

        console.log(typeof true) // "boolean"

        console.log(typeof "foo"); // "string"

        console.log(typeof Symbol("id")); // "symbol"

        console.log(typeof Math); // "object"  (1)

        console.log(typeof null); // "object"  (2)

        console.log(typeof alert); // "function"  (3)

        console.log(Symbol("id"));
    </script>

</body>

</html>
