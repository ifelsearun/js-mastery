<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data-types in JavaScript</title>
</head>

<body>

    <script>
        //Javascript is dynamically typed
        let message = 'hello world';
        console.log(message);
        message = 245643;
        console.log(message);

        //Infinity, -Infinity, NaN values
        alert(1 / 0);//Infinity
        alert(-1 / 0);//-Infinity
        alert(Infinity);

        //NaN
        alert("Not a Number" / 2);
    </script>

</body>

</html>
